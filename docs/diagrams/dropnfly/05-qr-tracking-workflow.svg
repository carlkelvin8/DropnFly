t-weight="650" fill="#102a43">Find booking</text><text x="730" y="302" text-anchor="middle" font-size="14" font-weight="400" fill="#102a43">and current status</text><g filter="url(#shadow)"><rect x="900" y="250" width="250" height="90" rx="12" fill="#ffe9e4" stroke="#315b7d" stroke-width="2"/></g><text x="1025" y="280" text-anchor="middle" font-size="17" font-weight="650" fill="#102a43">Validate next status</text><text x="1025" y="302" text-anchor="middle" font-size="14" font-weight="400" fill="#102a43">No same, backward, or skip</text><g filter="url(#shadow)"><rect x="900" y="430" width="300" height="120" rx="12" fill="#ffe9e4" stroke="#315b7d" stroke-width="2"/></g><text x="1050" y="460" text-anchor="middle" font-size="17" font-weight="650" fill="#102a43">Require evidence</text><text x="1050" y="482" text-anchor="middle" font-size="14" font-weight="400" fill="#102a43">Tags for Received; photo for Storage; customer QR for Delivered</text><g filter="url(#shadow)"><rect x="1240" y="250" width="280" height="100" rx="24" fill="#e8f3ff" stroke="#315b7d" stroke-width="2"/></g><text x="1380" y="280" text-anchor="middle" font-size="17" font-weight="650" fill="#102a43">Atomic update</text><text x="1380" y="302" text-anchor="middle" font-size="14" font-weight="400" fill="#102a43">Booking, items, tags, scan event</text><g filter="url(#shadow)"><rect x="1240" y="450" width="280" height="90" rx="24" fill="#e8f3ff" stroke="#315b7d" stroke-width="2"/></g><text x="1380" y="480" text-anchor="middle" font-size="17" font-weight="650" fill="#102a43">Log and notify</text><text x="1380" y="502" text-anchor="middle" font-size="14" font-weight="400" fill="#102a43">Customer status update</text><g filter="url(#shadow)"><rect x="620" y="500" width="230" height="90" rx="12" fill="#ffe9e4" stroke="#315b7d" stroke-width="2"/></g><text x="735" y="530" text-anchor="middle" font-size="17" font-weight="650" fill="#102a43">Reject update</text><text x="735" y="552" text-anchor="middle" font-size="14"